# Builds the app image and pushes it as :latest and as :$BUILD_ID (a fixed tag to roll back to).
#   gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/nestera-health/hah-agent/app:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/nestera-health/hah-agent/app:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/nestera-health/hah-agent/app:$BUILD_ID'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/nestera-health/hah-agent/app:latest'
  - 'us-central1-docker.pkg.dev/nestera-health/hah-agent/app:$BUILD_ID'

options:
  machineType: 'E2_HIGHCPU_8'   # faster build machine
